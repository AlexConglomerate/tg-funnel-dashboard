# Тексты и тайминги воронки. Проверяются при старте (src/funnel/config.py).
# Правка текста действует и на уже запланированные сообщения: текст берётся по key при отправке.
# Чтобы добавить шаг прогрева, допишите элемент в followups: на дашборде появится новый шаг воронки.

parse_mode: HTML

messages:
  welcome: |
    Привет! 👋
    Это регистрация на бесплатный эфир <b>«ИИ в работе: как экономить 10 часов в неделю»</b>.
    За час разберём рабочие сценарии с нейросетями: тексты, таблицы, презентации и автоматизация рутины.
  ask_phone: |
    Чтобы закрепить за вами место и прислать напоминание перед эфиром, оставьте номер телефона.
    Нажмите кнопку ниже 👇
  phone_button: "📱 Отправить номер"
  registered: |
    ✅ Готово, вы зарегистрированы!
    Скоро пришлём подарок для подготовки к эфиру.
  already_registered: |
    Вы уже зарегистрированы ✅
    Ссылку на эфир пришлём сюда же, ничего делать не нужно.
  not_own_contact: |
    Похоже, это чужой контакт 🙂
    Отправьте, пожалуйста, свой номер кнопкой ниже.
  use_button: |
    Чтобы завершить регистрацию, нажмите кнопку «📱 Отправить номер» ниже.

followups:
  - key: gift
    delay_seconds: 10
    text: |
      🎁 Обещанный подарок: <b>чек-лист из 20 промптов</b> для рабочих задач.
      Сохраните его, на эфире будем пользоваться.
  - key: warmup
    delay_seconds: 60
    text: |
      На эфире покажем вживую, как за 15 минут собрать отчёт, на который раньше уходил день.
      Подготовьте одну свою рутинную задачу: разберём её прямо в эфире 🔥
