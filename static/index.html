<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Воронка регистраций</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-accent-text-color, var(--accent));
    --danger: var(--tg-theme-destructive-text-color, #e53935);
    --sep: var(--tg-theme-section-separator-color, rgba(127, 127, 127, .18));
    --ok: #31b545;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 20px; margin: 4px 4px 2px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
       color: var(--hint); margin: 0 0 10px; }
  .sub { color: var(--hint); font-size: 13px; margin: 0 4px 12px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--hint); }

  .banner { display: none; background: var(--danger); color: #fff; border-radius: 10px;
            padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }
  .banner.show { display: block; }
  .state { text-align: center; padding: 48px 16px; color: var(--hint); }
  .state b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 560px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  .kpi { background: var(--card); border-radius: var(--radius); padding: 12px 14px; }
  .kpi .v { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .kpi .l { color: var(--hint); font-size: 13px; }
  .kpi.danger .v { color: var(--danger); }
  .kpi.accent .v { color: var(--accent-text); }

  .step { margin-bottom: 10px; }
  .step:last-child { margin-bottom: 0; }
  .step .row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 4px; }
  .bar { height: 10px; background: var(--sep); border-radius: 5px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 5px;
             transition: width .4s ease; }
  .drop { color: var(--hint); font-size: 12px; }

  .chart { display: flex; align-items: flex-end; gap: 2px; height: 120px; border-bottom: 1px solid var(--sep); }
  .col { flex: 1 1 0; min-width: 2px; height: 100%; display: flex; align-items: flex-end;
         justify-content: center; gap: 1px; }
  .col i { display: block; flex: 1 1 0; max-width: 10px; border-radius: 2px 2px 0 0;
           transition: height .4s ease; }
  .col i.s { background: var(--accent); opacity: .35; }
  .col i.p { background: var(--accent); }
  .axis { display: flex; justify-content: space-between; color: var(--hint); font-size: 12px; margin-top: 4px; }
  .legend { display: flex; gap: 14px; color: var(--hint); font-size: 12px; margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px;
                         border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--accent); }
  .legend .s::before { opacity: .35; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--hint); font-size: 12px; padding: 0 0 6px; }
  td { padding: 7px 0; border-top: 1px solid var(--sep); vertical-align: top; }
  th.r, td.r { text-align: right; padding-left: 8px; }
  .nowrap { white-space: nowrap; }
  .tag { display: inline-block; background: var(--sep); border-radius: 6px; padding: 0 6px; font-size: 12px; }

  .queue { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
  .queue .v { font-size: 20px; font-weight: 700; }
  .queue .l { color: var(--hint); font-size: 12px; }
  .queue .failed .v, .queue .blocked .v { color: var(--danger); }
  .queue .zero .v { color: var(--hint); }
  .empty { color: var(--hint); font-size: 14px; }
</style>
</head>
<body>
  <div id="offline" class="banner">Нет связи с сервером, показаны последние данные</div>

  <h1>Воронка регистраций</h1>
  <p class="sub">Обновлено: <span id="updated">—</span></p>

  <div id="state" class="state"><b>Загружаем…</b></div>

  <main id="app" hidden>
    <section class="kpis" style="margin-bottom:12px">
      <div class="kpi"><div class="v num" id="k-started">0</div><div class="l">Пришли</div></div>
      <div class="kpi"><div class="v num" id="k-phone">0</div><div class="l">Оставили телефон</div></div>
      <div class="kpi accent"><div class="v num" id="k-conv">0%</div><div class="l">Конверсия</div></div>
      <div class="kpi danger"><div class="v num" id="k-blocked">0</div><div class="l">Заблокировали</div></div>
    </section>

    <section class="card"><h2>Воронка</h2><div id="funnel"></div></section>

    <section class="card">
      <h2 id="timeline-title">По времени</h2>
      <div id="timeline"></div>
    </section>

    <section class="card"><h2>Источники</h2><div id="sources"></div></section>

    <section class="card"><h2>Очередь отправки</h2><div id="queue" class="queue"></div></section>

    <section class="card"><h2>Последние регистрации</h2><div id="recent"></div></section>
  </main>

<script>
(() => {
  "use strict";
  const REFRESH_MS = 5000;
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = (id) => document.getElementById(id);

  if (tg) { tg.ready(); tg.expand(); }

  const initData = tg ? tg.initData : "";
  if (!initData) {
    showState("Откройте дашборд из бота", "командой /dashboard или кнопкой меню");
    return;
  }

  let hasData = false;
  let timer = null;

  // Все данные от пользователей (имена, источники) вставляются только как текст.
  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "text") node.textContent = v;
      else if (k === "style") node.style.cssText = v;
      else node.setAttribute(k, v);
    }
    for (const child of children || []) if (child) node.append(child);
    return node;
  }
  const fmt = (n) => Number(n).toLocaleString("ru-RU");
  const pct = (v) => (v === null || v === undefined) ? "" : `${String(v).replace(".", ",")}%`;
  const time = (iso, withDate) => {
    if (!iso) return "—";
    const d = new Date(iso);
    const opts = withDate
      ? { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }
      : { hour: "2-digit", minute: "2-digit" };
    return d.toLocaleString("ru-RU", opts);
  };

  function showState(title, hint) {
    const s = $("state");
    s.replaceChildren(el("b", { text: title }), document.createTextNode(hint || ""));
    s.hidden = false;
    $("app").hidden = true;
  }

  function renderFunnel(steps) {
    const max = Math.max(1, ...steps.map((s) => s.count));
    $("funnel").replaceChildren(...steps.map((s) => el("div", { class: "step" }, [
      el("div", { class: "row" }, [
        el("span", { text: s.label }),
        el("span", { class: "num" }, [
          el("b", { text: fmt(s.count) }),
          s.pct_of_prev === null ? null : el("span", { class: "drop", text: `  ${pct(s.pct_of_prev)} от предыдущего` }),
        ]),
      ]),
      el("div", { class: "bar" }, [el("i", { style: `width:${(s.count / max) * 100}%` })]),
    ])));
  }

  function renderTimeline(tl) {
    $("timeline-title").textContent = tl.bucket === "hour" ? "По времени, по часам" : "По времени, по минутам";
    const pts = tl.points;
    if (!pts.length) { $("timeline").replaceChildren(el("div", { class: "empty", text: "Пока нет событий" })); return; }
    const max = Math.max(1, ...pts.map((p) => Math.max(p.started, p.with_phone)));
    const cols = pts.map((p) => el("div", {
      class: "col",
      title: `${time(p.t, tl.bucket === "hour")}: пришли ${p.started}, телефон ${p.with_phone}`,
    }, [
      el("i", { class: "s", style: `height:${(p.started / max) * 100}%` }),
      el("i", { class: "p", style: `height:${(p.with_phone / max) * 100}%` }),
    ]));
    const withDate = tl.bucket === "hour";
    $("timeline").replaceChildren(
      el("div", { class: "chart" }, cols),
      el("div", { class: "axis" }, [
        el("span", { text: time(pts[0].t, withDate) }),
        el("span", { text: `макс. ${fmt(max)}` }),
        el("span", { text: time(pts[pts.length - 1].t, withDate) }),
      ]),
      el("div", { class: "legend" }, [
        el("span", { class: "s", text: "/start" }),
        el("span", { class: "p", text: "телефон" }),
      ]),
    );
  }

  function renderSources(rows) {
    if (!rows.length) { $("sources").replaceChildren(el("div", { class: "empty", text: "Пока пусто" })); return; }
    $("sources").replaceChildren(el("table", {}, [
      el("tr", {}, [
        el("th", { text: "Источник" }), el("th", { class: "r", text: "Пришли" }),
        el("th", { class: "r", text: "Телефон" }), el("th", { class: "r", text: "Конв." }),
      ]),
      ...rows.map((r) => el("tr", {}, [
        el("td", {}, [el("span", { class: "tag", text: r.source })]),
        el("td", { class: "r num", text: fmt(r.started) }),
        el("td", { class: "r num", text: fmt(r.with_phone) }),
        el("td", { class: "r num", text: pct(r.conversion_pct) }),
      ])),
    ]));
  }

  function renderQueue(q) {
    const labels = { pending: "в очереди", sent: "отправлено", failed: "ошибки", blocked: "блок" };
    $("queue").replaceChildren(...Object.keys(labels).map((k) => el("div", {
      class: `${k}${q[k] ? "" : " zero"}`,
    }, [
      el("div", { class: "v num", text: fmt(q[k] || 0) }),
      el("div", { class: "l", text: labels[k] }),
    ])));
  }

  function renderRecent(rows) {
    if (!rows.length) { $("recent").replaceChildren(el("div", { class: "empty", text: "Пока никого" })); return; }
    $("recent").replaceChildren(el("table", {}, [
      el("tr", {}, [
        el("th", { text: "Кто" }), el("th", { text: "Телефон" }), el("th", { class: "r", text: "Когда" }),
      ]),
      ...rows.map((r) => el("tr", {}, [
        el("td", {}, [
          el("div", { text: r.name || (r.username ? "@" + r.username : "без имени") }),
          el("div", { class: "muted", style: "font-size:12px" }, [
            el("span", { class: "tag", text: r.source }),
            r.username && r.name ? document.createTextNode(` @${r.username}`) : null,
          ]),
        ]),
        el("td", { class: "num nowrap", text: r.phone_masked || "—" }),
        el("td", { class: "r num muted", text: time(r.phone_at || r.started_at, true) }),
      ])),
    ]));
  }

  function render(d) {
    $("k-started").textContent = fmt(d.totals.started);
    $("k-phone").textContent = fmt(d.totals.with_phone);
    $("k-conv").textContent = pct(d.totals.conversion_pct);
    $("k-blocked").textContent = fmt(d.totals.blocked);
    renderFunnel(d.funnel);
    renderTimeline(d.timeline);
    renderSources(d.by_source);
    renderQueue(d.queue);
    renderRecent(d.recent);
    $("updated").textContent = new Date().toLocaleTimeString("ru-RU");
    $("state").hidden = true;
    $("app").hidden = false;
  }

  async function load() {
    try {
      const res = await fetch("/api/stats", {
        headers: { Authorization: `tma ${initData}` },
        cache: "no-store",
      });
      if (res.status === 401 || res.status === 403) {
        clearInterval(timer);
        showState("Нет доступа", "дашборд доступен только администраторам бота");
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      render(await res.json());
      hasData = true;
      $("offline").classList.remove("show");
    } catch (err) {
      $("offline").classList.add("show");
      if (!hasData) showState("Нет связи с сервером", "пробуем снова каждые 5 секунд");
    }
  }

  load();
  timer = setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
